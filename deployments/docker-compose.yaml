version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=Rediet
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=digital_contract_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    environment:
      - DATABASE_URL=postgres://Rediet:postgres@db:5432/digital_contract_db?sslmode=disable
    depends_on:
      - db

  contract-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: contract
    environment: 
      - DATABASE_URL=postgres://Rediet:postgres@db:5432/digital_contract_db?sslmode=disable
    depends_on:
      - db

volumes:
  postgres_data: