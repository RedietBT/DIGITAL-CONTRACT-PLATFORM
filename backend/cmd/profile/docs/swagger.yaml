basePath: /
definitions:
  handler.LoginRequest:
    properties:
      email:
        example: dev@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handler.RegisterRequest:
    properties:
      email:
        example: dev@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  models.Profile:
    properties:
      bio:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      is_template_seller:
        type: boolean
      rating_avg:
        type: number
      rating_count:
        type: integer
      skill_level:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8082
info:
  contact: {}
  description: Profile Service for the Digital Contract Platform.
  title: Digital Contract Platform - Profile Service
  version: "1.0"
paths:
  /auth/admin/user-status:
    put:
      responses: {}
      security:
      - ApiKeyAuth: []
      summary: Update user status (Admin only)
      tags:
      - admin
  /auth/admin/users:
    delete:
      responses: {}
      security:
      - ApiKeyAuth: []
      summary: Delete a user
      tags:
      - admin
    get:
      responses: {}
      security:
      - ApiKeyAuth: []
      summary: Get all users (Admin only)
      tags:
      - admin
  /auth/forgot-password:
    post:
      responses: {}
      summary: Forgot Password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      responses: {}
      summary: Logout user
  /auth/me:
    get:
      responses: {}
      security:
      - ApiKeyAuth: []
      summary: Get user profile
  /auth/me/email:
    put:
      responses: {}
      security:
      - ApiKeyAuth: []
      summary: Update own email
  /auth/me/password:
    put:
      responses: {}
      security:
      - ApiKeyAuth: []
      summary: Change own password
  /auth/refresh:
    post:
      responses: {}
      summary: Refresh access token
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account and returns the user object.
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      responses: {}
      summary: Reset password using token
      tags:
      - auth
  /profile/me:
    get:
      description: Fetches the profile for the user identified by the JWT token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Profile'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get My Profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      description: Allows the user to update their display name, bio, and other details.
      parameters:
      - description: Profile data
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/models.Profile'
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update Profile
      tags:
      - profile
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
