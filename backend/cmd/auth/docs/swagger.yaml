basePath: /
definitions:
  handler.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.ForgotPasswordRequest:
    properties:
      email:
        example: dev@example.com
        type: string
    required:
    - email
    type: object
  handler.LoginRequest:
    properties:
      email:
        example: dev@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handler.LoginResponse:
    properties:
      token:
        type: string
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.RegisterRequest:
    properties:
      email:
        description: |-
          'validate' tags define our rules
          required: must be present
          email: must be a valid email format
          min=8: password must be at least 8 characters
        example: dev@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handler.ResetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - email
    - new_password
    - token
    type: object
  handler.UpdateEmailRequest:
    properties:
      new_email:
        type: string
    required:
    - new_email
    type: object
  handler.UpdateStatusRequest:
    properties:
      status:
        type: string
      user_id:
        type: string
    required:
    - status
    - user_id
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the Auth Service for the Digital Contract Platform.
  title: Digital Contract Platform API
  version: "1.0"
paths:
  /auth/admin/user-status:
    put:
      description: Allows an admin to activate or deactivate a user account.
      parameters:
      - description: Status Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateStatusRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update user status (Admin only)
      tags:
      - admin
  /auth/admin/users:
    delete:
      consumes:
      - application/json
      description: Removes a user from the system. Admin only.
      parameters:
      - description: User ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: ID required
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Delete a user
      tags:
      - admin
    get:
      consumes:
      - application/json
      description: Retrieves a list of all registered users. Accessible only by admin
        users.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get all users (Admin only)
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiate password reset process by sending a reset link to the
        user's email.
      parameters:
      - description: Forgot Password Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: If the email exists, a reset code has been sent.
          schema:
            type: string
        "400":
          description: Invalid Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Forgot Password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and returns a JWT token upon successful login.
      parameters:
      - description: Login Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Invalid Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Server Error
          schema:
            type: string
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      description: Informs the client to clear the session.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - auth
  /auth/me:
    delete:
      consumes:
      - application/json
      description: Deletes the currently authenticated user's account.
      parameters:
      - description: User ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: ID required
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Delete own account
      tags:
      - auth
    get:
      consumes:
      - application/json
      description: Retrieves the profile information of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get user profile
      tags:
      - auth
  /auth/me/email:
    put:
      consumes:
      - application/json
      description: Updates the email address of the currently authenticated user.
      parameters:
      - description: New Email Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Email updated successfully"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Update own email
      tags:
      - auth
  /auth/me/password:
    put:
      consumes:
      - application/json
      description: Allows the user to update their password after verifying their
        old one.
      parameters:
      - description: Password Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Incorrect current password
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Change own password
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Provides a new access token using a valid refresh token.
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{"access_token": "new_jwt_here"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired token
          schema:
            type: string
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account and returns the user object (excluding
        password).
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid Request
          schema:
            type: string
        "500":
          description: Server Error
          schema:
            type: string
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Verifies the reset token and updates the user's password in the
        database.
      parameters:
      - description: Reset Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successful
          schema:
            type: string
        "400":
          description: Invalid token or expired
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Reset password using token
      tags:
      - auth
securityDefinitions:
  ApiKeyAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
