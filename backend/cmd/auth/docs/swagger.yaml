basePath: /
definitions:
  handler.RegisterRequest:
    properties:
      email:
        description: |-
          'validate' tags define our rules
          required: must be present
          email: must be a valid email format
          min=8: password must be at least 8 characters
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
    required:
    - password
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the Auth Service for the Digital Contract Platform.
  title: Digital Contract Platform API
  version: "1.0"
paths:
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account and returns the user object (excluding
        password).
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid Request
          schema:
            type: string
        "500":
          description: Server Error
          schema:
            type: string
      summary: Register a new user
      tags:
      - auth
swagger: "2.0"
