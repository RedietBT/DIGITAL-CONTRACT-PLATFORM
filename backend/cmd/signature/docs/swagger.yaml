basePath: /
definitions:
  handler.AssignParticipantsRequest:
    properties:
      participant_ids:
        items:
          type: string
        type: array
    required:
    - participant_ids
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.CreateContractRequest:
    properties:
      content:
        type: string
      description:
        maxLength: 1000
        minLength: 3
        type: string
      participant_ids:
        items:
          type: string
        type: array
      title:
        minLength: 3
        type: string
    required:
    - content
    - description
    - participant_ids
    - title
    type: object
  handler.ForgotPasswordRequest:
    properties:
      email:
        example: dev@example.com
        type: string
    required:
    - email
    type: object
  handler.LoginRequest:
    properties:
      email:
        example: dev@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.RegisterRequest:
    properties:
      email:
        example: dev@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handler.ResetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - email
    - new_password
    - token
    type: object
  handler.SignContractRequest:
    properties:
      contract_id:
        type: string
      file_url:
        description: 'For Uploading: URL to the hosted image'
        type: string
      typed_name:
        description: 'For Typing: The plain text name they typed'
        minLength: 2
        type: string
      vector_data:
        description: 'For Drawing: SVG or JSON vector data'
        items:
          type: integer
        type: array
    required:
    - contract_id
    type: object
  handler.UpdateContractRequest:
    properties:
      description:
        maxLength: 1000
        minLength: 3
        type: string
      title:
        minLength: 3
        type: string
    required:
    - description
    - title
    type: object
  handler.UpdateEmailRequest:
    properties:
      new_email:
        type: string
    required:
    - new_email
    type: object
  handler.UpdateProfileRequest:
    properties:
      bio:
        maxLength: 500
        type: string
      display_name:
        minLength: 2
        type: string
      is_template_seller:
        type: boolean
      skill_level:
        minimum: 2
        type: integer
    required:
    - display_name
    - is_template_seller
    - skill_level
    type: object
  handler.UpdateStatusRequest:
    properties:
      status:
        type: string
      user_id:
        type: string
    required:
    - status
    - user_id
    type: object
  models.Contract:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      current_version:
        type: integer
      description:
        maxLength: 1000
        minLength: 3
        type: string
      id:
        type: string
      owner_user_id:
        type: string
      participants:
        items:
          $ref: '#/definitions/models.ContractParticipant'
        type: array
      status:
        type: string
      template_id:
        type: string
      title:
        maxLength: 100
        minLength: 3
        type: string
      updated_at:
        type: string
      versions:
        items:
          $ref: '#/definitions/models.ContractVersion'
        type: array
    required:
    - description
    - title
    type: object
  models.ContractParticipant:
    properties:
      added_at:
        type: string
      contract_id:
        type: string
      id:
        type: string
      is_required:
        type: boolean
      role:
        description: signer, viewer, approver
        type: string
      signed_at:
        type: string
      signing_order:
        type: integer
      status:
        description: pending, signed, declined
        type: string
      user_id:
        description: Auth Service Reference
        type: string
    type: object
  models.ContractVersion:
    properties:
      content_json:
        description: Stores articles/bookmarks
        type: object
      contract_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      version_number:
        type: integer
    type: object
  models.Profile:
    properties:
      bio:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      is_template_seller:
        type: boolean
      rating_avg:
        type: number
      rating_count:
        type: integer
      skill_level:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.Signature:
    properties:
      contract_id:
        type: string
      device_info:
        type: string
      file_url:
        description: VectorData stores the coordinates/paths as JSONB
        type: string
      hash:
        description: SHA-256 for integrity
        type: string
      height:
        type: number
      id:
        type: string
      ip_address:
        type: string
      page_number:
        description: Position on the PDF page
        type: integer
      pos_x:
        type: number
      pos_y:
        type: number
      render_style_id:
        type: string
      signature_type:
        description: e.g., 'drawn', 'typed'
        type: string
      signed_at:
        description: Audit Security
        type: string
      user_id:
        type: string
      vector_data:
        description: 'FIX: Added swaggertype tag for the swagger generator'
        type: object
      width:
        type: number
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8084
info:
  contact: {}
  description: |-
    Type your JWT token
    Service for managing digital signatures.
  title: Digital Contract Platform - Signature Service
  version: "1.0"
paths:
  /auth/admin/user-status:
    put:
      consumes:
      - application/json
      description: Updates the status of a specific user. Requires admin privileges.
      parameters:
      - description: User ID and New Status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid status value
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to update user status
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Update user status (Admin only)
      tags:
      - admin
  /auth/admin/users:
    delete:
      description: Deletes a user account. If no ID is provided, deletes the authenticated
        user.
      parameters:
      - description: User ID to delete
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted user
        "500":
          description: Failed to delete user
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Delete a user
      tags:
      - admin
    get:
      description: Retrieves a list of all users in the system. Requires admin privileges.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved list of users
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: Failed to retrieve users
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Get all users (Admin only)
      tags:
      - admin
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiates the password reset process by sending a reset code to
        the user's email.
      parameters:
      - description: User Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid email format
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to send reset code
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Forgot Password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies credentials and returns access and refresh tokens.
      parameters:
      - description: User Credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns access_token and refresh_token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'Unauthorized: Invalid email or password'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate a user
      tags:
      - auth
  /auth/logout:
    post:
      description: Logs out the authenticated user by invalidating the current session.
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to logout
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Logout user
      tags:
      - default
  /auth/me:
    get:
      description: Retrieves the profile information of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved user profile
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: 'Unauthorized: User not found in context'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Get user profile
      tags:
      - default
  /auth/me/email:
    put:
      consumes:
      - application/json
      description: Updates the email address of the authenticated user.
      parameters:
      - description: New Email Address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid email format
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to update email
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Update own email
      tags:
      - default
  /auth/me/password:
    put:
      consumes:
      - application/json
      description: Updates the password of the authenticated user.
      parameters:
      - description: Old and New Passwords
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid password or mismatch
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to change password
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Change own password
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes the access token using a valid refresh token.
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New access token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'Unauthorized: Invalid refresh token'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - default
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account in the auth service and broadcasts a
        creation event via RabbitMQ.
      parameters:
      - description: User Registration Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created user
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid input data
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets the user's password using a verification token.
      parameters:
      - description: Reset Password Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid token or password mismatch
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to reset password
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password using token
      tags:
      - default
  /contracts:
    get:
      consumes:
      - application/json
      description: Get all contracts owned by the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Contract'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: List user contracts
      tags:
      - contracts
    post:
      consumes:
      - application/json
      description: Creates a contract and initializes Version 1
      parameters:
      - description: Contract
        in: body
        name: contract
        required: true
        schema:
          $ref: '#/definitions/handler.CreateContractRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Contract'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Create a new contract
      tags:
      - contracts
  /contracts/{id}:
    delete:
      description: Hard delete a contract and its associated data
      parameters:
      - description: Contract ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Delete a contract
      tags:
      - contracts
    get:
      consumes:
      - application/json
      description: Retrieves contract details including versions and participants
      parameters:
      - description: Contract ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Contract'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Get a single contract
      tags:
      - contracts
    put:
      consumes:
      - application/json
      description: Update title/description of a draft contract
      parameters:
      - description: Contract ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Data
        in: body
        name: contract
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateContractRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Update contract metadata
      tags:
      - contracts
  /contracts/{id}/participants:
    post:
      description: Adds users to the participant list and moves contract to 'pending'
        status
      parameters:
      - description: Contract ID
        in: path
        name: id
        required: true
        type: string
      - description: List of User IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AssignParticipantsRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Assign signers to a contract
      tags:
      - contracts
  /profile/me:
    get:
      description: Fetches the profile for the user identified by the JWT token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Profile'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Get My Profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      description: Update your display name, bio, and seller settings.
      parameters:
      - description: Profile update data
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Update Profile
      tags:
      - profile
  /signatures:
    post:
      consumes:
      - application/json
      description: Adds a user's signature (vector or image) to a pending contract
      parameters:
      - description: Signature Data
        in: body
        name: signature
        required: true
        schema:
          $ref: '#/definitions/handler.SignContractRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Signature'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Create a signature
      tags:
      - signatures
  /signatures/{id}:
    delete:
      description: Deletes a signature mark if the contract is still pending
      parameters:
      - description: Signature ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Remove a signature
      tags:
      - signatures
  /signatures/contract/{contract_id}:
    get:
      description: Retrieves a specific signature record by ID
      parameters:
      - description: Contract ID
        in: path
        name: contract_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Signature'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AuthKey: []
      summary: Get a user's signature
      tags:
      - signatures
securityDefinitions:
  AuthKey:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
